# Host has ~7G RAM; Flutter template defaults (Xmx8G + Metaspace4G) cause native OOM
# and "Gradle build daemon disappeared unexpectedly". Keep heap well under physical RAM.
org.gradle.jvmargs=-Xmx2G -XX:MaxMetaspaceSize=512m -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false
